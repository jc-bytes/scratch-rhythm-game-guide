name: Deploy guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the guide
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the guide
        run: |
          npm run lint
          npm test
          node --check scripts/github-pages.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Export the static guide
        run: npm run export:github-pages -- github-pages-dist "https://jc-bytes.github.io/scratch-rhythm-game-guide/"
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
